name: MiniSim CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-build
  cancel-in-progress: true

env:
  DERIVED_DATA_PATH: ${{ github.workspace }}/DerivedData

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: GitHub Action for SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1

  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA_PATH }}
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-
      - name: Build
        run: |
          set -o pipefail && xcodebuild -scheme MiniSim -destination 'platform=macOS' \
          -skipPackagePluginValidation -skipMacroValidation \
          -derivedDataPath ${{ env.DERIVED_DATA_PATH }} \
          build-for-testing \
          COMPILER_INDEX_STORE_ENABLE=NO | xcbeautify --renderer github-actions

  test:
    if: github.event_name != 'workflow_dispatch'
    needs: build
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA_PATH }}
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/*.xcodeproj/project.pbxproj') }}
      - name: Test
        run: |
          set -o pipefail && xcodebuild -scheme MiniSim -destination 'platform=macOS' \
          -skipPackagePluginValidation -skipMacroValidation \
          -derivedDataPath ${{ env.DERIVED_DATA_PATH }} \
          test-without-building \
          COMPILER_INDEX_STORE_ENABLE=NO | xcbeautify --renderer github-actions

  build-unsigned:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA_PATH }}
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-
      - name: Build unsigned Release app
        run: |
          set -o pipefail && xcodebuild -scheme MiniSim -configuration Release \
          -destination 'platform=macOS' \
          -skipPackagePluginValidation -skipMacroValidation \
          -derivedDataPath ${{ env.DERIVED_DATA_PATH }} \
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO \
          build | xcbeautify --renderer github-actions
      - name: Package app
        run: |
          cd "${{ env.DERIVED_DATA_PATH }}/Build/Products/Release"
          ditto -c -k --sequesterRsrc --keepParent MiniSim.app "$GITHUB_WORKSPACE/MiniSim-unsigned.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniSim-unsigned
          path: MiniSim-unsigned.zip
          if-no-files-found: error
